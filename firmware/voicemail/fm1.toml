# VOICEMAIL's build settings (fm1-base's tools/build.py: tools/build.sh voicemail)
name = "VOICEMAIL"             # the build's files: voicemail.fwsc; APP_NAME (the screen) is in app.h
id_prefix = "FM-1_72"          # package identity: dev FM-1_7200, releases FM-1_72XXYYZZ
usb_manufacturer = "haunted-fm1"
usb_product = "VOICEMAIL FM-1"
ble = false
usb_audio_in = true            # the music recordable over USB
usb_audio_out = false
words = "words.tsv"
include = ["../../lib", "dsp"]   # hdsp.h, hui.h (shared by the five firmwares); the engine's header
o2 = ["dsp/engine.c"]          # the engine, at -O2
# the site
tagline = "The ghost-vocal fragment machine"
blurb = "A voice that almost says something. A formant singer sings phrases, not steps: a call, an answer, a chorus, a silence. SELECT drops the pitch with the throat held, and Fragment, Stutter and Reverse cut the words to pieces."
colour = "#6a7fa8"
repo = "https://github.com/thedavidpryan/haunted-fm1"
licence = "MIT"
credits = "One of the five haunted firmwares; the reverb is Jon Dattorro's plate, the vowels Peterson and Barney's."
