# Build every firmware (one job each), run its host-simulator scenarios, keep the packages as artifacts; then
# assemble the site (the flasher page, the browser emulators, the manuals, the packages) and publish it on GitHub
# Pages (Settings -> Pages -> Source: GitHub Actions). A tag vX.Y also makes a GitHub release with the packages.
name: Build firmwares

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(cat VERSION)-dev" >> "$GITHUB_OUTPUT"
          fi

  # the toolchain and the SDK fetched once, into the caches the five builds restore (five jobs fetching the SDK at
  # once from gitee was flaky)
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: JieLi toolchain (cached)
        id: tc
        uses: actions/cache@v4
        with:
          path: ~/.jieli/toolchain-dir
          key: jieli-toolchain-${{ hashFiles('base/tools/get_toolchain.sh') }}
      - if: steps.tc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.jieli/toolchain-dir
          sh tools/get_toolchain.sh ~/.jieli/toolchain-dir
      - name: JieLi AC79 SDK (cached)
        id: sdk
        uses: actions/cache@v4
        with:
          path: ~/.jieli/ac79-sdk
          key: ac79-sdk-${{ hashFiles('base/bsp/tools/get_sdk.sh') }}
      - if: steps.sdk.outputs.cache-hit != 'true'
        run: sh tools/get_sdk.sh ~/.jieli/ac79-sdk

  build:
    needs: [version, prepare]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fw: [midnight-route, voicemail, untrue-step, half-light, worn-tape]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow

      - name: JieLi toolchain (cached)
        id: tc
        uses: actions/cache@v4
        with:
          path: ~/.jieli/toolchain-dir
          key: jieli-toolchain-${{ hashFiles('base/tools/get_toolchain.sh') }}
      - if: steps.tc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.jieli/toolchain-dir
          sh tools/get_toolchain.sh ~/.jieli/toolchain-dir
      - name: JieLi AC79 SDK (cached)
        id: sdk
        uses: actions/cache@v4
        with:
          path: ~/.jieli/ac79-sdk
          key: ac79-sdk-${{ hashFiles('base/bsp/tools/get_sdk.sh') }}
      - if: steps.sdk.outputs.cache-hit != 'true'
        run: sh tools/get_sdk.sh ~/.jieli/ac79-sdk

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Build the firmware
        env:
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain-dir/toolchain
          AC79_SDK: /home/runner/.jieli/ac79-sdk
        run: sh tools/build.sh ${{ matrix.fw }} --release ${{ needs.version.outputs.version }}

      - name: Host simulator scenarios
        run: sh tools/build.sh ${{ matrix.fw }} --host && sh tools/test.sh ${{ matrix.fw }}

      - name: Browser emulator
        run: sh tools/build.sh ${{ matrix.fw }} --web --release ${{ needs.version.outputs.version }}

      - name: Collect
        run: |
          mkdir -p dist/${{ matrix.fw }}
          cp firmware/${{ matrix.fw }}/build/*.fwsc dist/${{ matrix.fw }}/
          cp -r firmware/${{ matrix.fw }}/build/emu dist/${{ matrix.fw }}/emu
          ls -la dist/${{ matrix.fw }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.fw }}
          path: dist/${{ matrix.fw }}
          if-no-files-found: error

  site:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Make the site
        run: python3 tools/make_site.py dist ${{ needs.version.outputs.version }} _site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - run: find dist -name '*.fwsc' -exec cp {} . \; && ls *.fwsc
      - uses: softprops/action-gh-release@v2
        with:
          files: '*.fwsc'
          body: |
            Five generative firmwares for the M-VAVE FM-1. Install from the flasher page (Chrome or Edge, FM-1 on USB),
            or with `python3 base/tools/fm1_install.py NAME-${{ needs.version.outputs.version }}.fwsc`.
